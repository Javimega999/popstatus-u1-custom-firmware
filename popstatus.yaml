# PopStatus U1 - firmware alternativo (no oficial) para la barra LED BIQU PopStatus de la Snapmaker U1.
# Unofficial alternative firmware for the BIQU PopStatus LED bar for the Snapmaker U1.
# ESP32-C3 · 27 LEDs WS2812 (GRB) en GPIO5 · ESPHome. Todo se ajusta desde su pagina web: http://<ip-del-popstatus>
#  - 11 estados (sin impresora, reposo, preparando, calentando, imprimiendo, pausa, terminado, error, cama caliente,
#    enfriando y listo para despegar), cada uno con su efecto, color, brillo y velocidad.
#  - Color del filamento en uso, deteccion de placa PEI / CryoGrip, modo noche, WiFi configurable y red de rescate.
substitutions:
  ip_impresora: "192.168.1.100"   # IP de tu Snapmaker U1 (tambien se cambia luego desde la web)

esphome:
  name: popstatus
  friendly_name: PopStatus
  project:
    name: "popstatus.u1"
    version: "3.3"
  includes:
    - popstatus_fx.h
  on_boot:
    priority: -100
    then:
      - light.turn_off: barra

esp32:
  board: esp32-c3-devkitm-1
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  hardware_uart: UART0

preferences:
  flash_write_interval: 10s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # sin ahorro de energia: el ahorro despierta la radio a ratos y puede corromper la senal de los LEDs (LED suelto en verde)
  power_save_mode: none
  ap:
    ssid: "PopStatus rescate"
    password: !secret ap_password

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: sntp
    id: hora
    timezone: Europe/Madrid

http_request:
  verify_ssl: false
  timeout: 2s

web_server:
  port: 80
  version: 3
  js_url: ""
  js_include: "ui.js"
  sorting_groups:
    - {id: g_general, name: "General", sorting_weight: -100}
    - {id: g_info, name: "Impresora", sorting_weight: -90}
    - {id: g_noche, name: "Modo noche", sorting_weight: -80}
    - {id: g_reposo, name: "En reposo", sorting_weight: 1}
    - {id: g_preparando, name: "Preparando", sorting_weight: 2}
    - {id: g_calentando, name: "Calentando", sorting_weight: 2}
    - {id: g_imprimiendo, name: "Imprimiendo", sorting_weight: 3}
    - {id: g_pausa, name: "Pausa", sorting_weight: 4}
    - {id: g_terminado, name: "Terminado", sorting_weight: 5}
    - {id: g_enfriando, name: "Enfriando", sorting_weight: 5}
    - {id: g_despegar, name: "Listo para despegar", sorting_weight: 5}
    - {id: g_error, name: "Error", sorting_weight: 6}
    - {id: g_caliente, name: "Cama caliente", sorting_weight: 7}
    - {id: g_sin, name: "Sin impresora", sorting_weight: 8}

packages:
  reposo:      !include {file: estado.yaml, vars: {id: reposo,      nombre: "Reposo",        efecto: "Respirar",          color: "FFFFFF", brillo: 70,  vel: 60}}
  preparando:  !include {file: estado.yaml, vars: {id: preparando,  nombre: "Preparando",    efecto: "Onda",              color: "8A5CFF", brillo: 70,  vel: 40}}
  calentando:  !include {file: estado.yaml, vars: {id: calentando,  nombre: "Calentando",    efecto: "Barra de progreso", color: "FF6A00", brillo: 70,  vel: 50}}
  imprimiendo: !include {file: estado.yaml, vars: {id: imprimiendo, nombre: "Imprimiendo",   efecto: "Barra de progreso", color: "00C8FF", brillo: 70,  vel: 50}}
  pausa:       !include {file: estado.yaml, vars: {id: pausa,       nombre: "Pausa",         efecto: "Respirar",          color: "FFB000", brillo: 70,  vel: 50}}
  enfriando:   !include {file: estado.yaml, vars: {id: enfriando,   nombre: "Enfriando",     efecto: "Barra de progreso", color: "7FDBFF", brillo: 70,  vel: 35}}
  despegar:    !include {file: estado.yaml, vars: {id: despegar,    nombre: "Listo para despegar", efecto: "Respirar",   color: "00FF3C", brillo: 80,  vel: 50}}
  terminado:   !include {file: estado.yaml, vars: {id: terminado,   nombre: "Terminado",     efecto: "Fijo",              color: "00FF3C", brillo: 80,  vel: 50}}
  error:       !include {file: estado.yaml, vars: {id: error,       nombre: "Error",         efecto: "Parpadeo",          color: "FF0000", brillo: 100, vel: 70}}
  caliente:    !include {file: estado.yaml, vars: {id: caliente,    nombre: "Cama caliente", efecto: "Respirar",          color: "FF3000", brillo: 50,  vel: 25}}
  sin:         !include {file: estado.yaml, vars: {id: sin,         nombre: "Sin impresora", efecto: "Apagado",           color: "3040FF", brillo: 20,  vel: 30}}

globals:
  # 0 sin impresora, 1 reposo, 2 calentando, 3 imprimiendo, 4 pausa, 5 terminado, 6 error, 7 cama caliente, 8 preparando, 9 listo para despegar (CryoGrip fria), 10 enfriando (CryoGrip aun caliente)
  - {id: estado, type: int, initial_value: "0"}
  - {id: progreso, type: float, initial_value: "0"}
  - {id: calor, type: float, initial_value: "0"}
  - {id: cama, type: float, initial_value: "0"}
  - {id: ultimo_ok, type: uint32_t, initial_value: "0"}
  - {id: estado_desde, type: uint32_t, initial_value: "0"}
  - {id: estado_bruto, type: int, initial_value: "-1"}
  - {id: color_fil, type: uint32_t, initial_value: "0"}
  - {id: hay_color_fil, type: bool, initial_value: "false"}
  - {id: capa_act, type: int, initial_value: "-1"}
  - {id: capa_tot, type: int, initial_value: "0"}
  - {id: duracion, type: float, initial_value: "0"}
  - {id: boquilla, type: float, initial_value: "0"}
  # Probar estado: indice del estado que se ensena en la barra durante 15 s (-1 = ninguno)
  - {id: prueba, type: int, initial_value: "-1"}
  # placa: 0 sin saber, 1 PEI, 2 CryoGrip (se deduce de la temperatura de cama que pide la impresion)
  - {id: placa, type: int, initial_value: "0", restore_value: true}
  # enfriando: temperatura de la cama al empezar a enfriar y cuanto calor queda (1 -> 0)
  - {id: enfr_ini, type: float, initial_value: "0"}
  - {id: enfr_prog, type: float, initial_value: "0"}
  - {id: prueba_desde, type: uint32_t, initial_value: "0"}

switch:
  - platform: template
    id: activa
    name: "Luz activa"
    icon: mdi:lightbulb-on
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server: {sorting_group_id: g_general, sorting_weight: 1}
  - platform: template
    id: invertir
    name: "Invertir dirección"
    icon: mdi:swap-horizontal
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server: {sorting_group_id: g_general, sorting_weight: 3}
  - platform: template
    id: usar_filamento
    name: "Color del filamento al imprimir"
    icon: mdi:printer-3d-nozzle
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server: {sorting_group_id: g_general, sorting_weight: 6}
  - platform: template
    id: noche
    name: "Modo noche"
    icon: mdi:weather-night
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server: {sorting_group_id: g_noche, sorting_weight: 1}

number:
  - platform: template
    id: brillo_general
    name: "Brillo general"
    icon: mdi:brightness-percent
    min_value: 5
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
    initial_value: 70
    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: g_general, sorting_weight: 2}
  - platform: template
    id: reposo_apagar
    name: "Apagar en reposo tras (min, 0 = nunca)"
    icon: mdi:timer-off
    min_value: 0
    max_value: 240
    step: 5
    unit_of_measurement: "min"
    mode: box
    initial_value: 30
    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: g_general, sorting_weight: 4}
  - platform: template
    id: terminado_min
    name: "Aviso de terminado durante (min)"
    icon: mdi:timer-check
    min_value: 1
    max_value: 240
    step: 1
    unit_of_measurement: "min"
    mode: box
    initial_value: 3
    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: g_general, sorting_weight: 5}
  - platform: template
    id: noche_desde
    name: "Noche desde (hora)"
    icon: mdi:clock-start
    min_value: 0
    max_value: 23
    step: 1
    unit_of_measurement: "h"
    mode: box
    initial_value: 23
    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: g_noche, sorting_weight: 2}
  - platform: template
    id: noche_hasta
    name: "Noche hasta (hora)"
    icon: mdi:clock-end
    min_value: 0
    max_value: 23
    step: 1
    unit_of_measurement: "h"
    mode: box
    initial_value: 8
    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: g_noche, sorting_weight: 3}
  - platform: template
    id: noche_brillo
    name: "Brillo de noche (0 = apagada)"
    icon: mdi:brightness-4
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
    initial_value: 15
    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: g_noche, sorting_weight: 4}

  - platform: template
    id: cryogrip_max
    name: "CryoGrip hasta (°C)"
    icon: mdi:snowflake-thermometer
    min_value: 20
    max_value: 60
    step: 1
    unit_of_measurement: "°C"
    mode: box
    initial_value: 45
    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: g_info, sorting_weight: 11}


  - platform: template
    id: despegar_temp
    name: "Despegar a (°C)"
    icon: mdi:snowflake
    min_value: 15
    max_value: 40
    step: 1
    unit_of_measurement: "°C"
    mode: box
    initial_value: 28
    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: g_info, sorting_weight: 12}

select:
  - platform: template
    id: probar
    name: "Probar estado"
    icon: mdi:play-circle
    options: ["No", "Sin impresora", "Reposo", "Calentando", "Imprimiendo", "Pausa", "Terminado", "Error", "Cama caliente", "Preparando", "Listo para despegar", "Enfriando"]
    initial_option: "No"
    optimistic: true
    on_value:
      - lambda: |-
          id(prueba) = (int) i - 1;
          id(prueba_desde) = millis();
    web_server: {sorting_group_id: g_general, sorting_weight: 9}

text:
  - platform: template
    id: ip_impresora
    name: "IP de la impresora"
    icon: mdi:ip-network
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${ip_impresora}"
    web_server: {sorting_group_id: g_info, sorting_weight: 10}
  - platform: template
    id: wifi_nueva_red
    name: "Nueva red WiFi"
    icon: mdi:wifi-plus
    mode: text
    max_length: 32
    optimistic: true
    web_server: {sorting_group_id: g_general, sorting_weight: 20}
  - platform: template
    id: wifi_nueva_clave
    name: "Nueva contraseña WiFi"
    icon: mdi:form-textbox-password
    mode: password
    max_length: 64
    optimistic: true
    web_server: {sorting_group_id: g_general, sorting_weight: 21}

button:
  - platform: template
    name: "Cambiar WiFi"
    icon: mdi:wifi-sync
    web_server: {sorting_group_id: g_general, sorting_weight: 22}
    on_press:
      - if:
          condition:
            lambda: return !id(wifi_nueva_red).state.empty();
          then:
            - wifi.configure:
                ssid: !lambda return id(wifi_nueva_red).state;
                password: !lambda return id(wifi_nueva_clave).state;
                save: true
                timeout: 30s
                on_connect:
                  - logger.log: "WiFi nueva conectada"
                on_error:
                  - logger.log: "La WiFi nueva no conecta: vuelvo a la anterior"
            # no dejar la contrasena a la vista en la web
            - lambda: |-
                id(wifi_nueva_clave).make_call().set_value("").perform();
  - platform: restart
    name: "Reiniciar"
    icon: mdi:restart
    web_server: {sorting_group_id: g_general, sorting_weight: 23}

light:
  - platform: esp32_rmt_led_strip
    id: barra
    name: "Barra"
    internal: true
    pin: GPIO5
    num_leds: 27
    rmt_symbols: 192        # toda la memoria RMT del C3: el WiFi no corta la senal (LED suelto en verde)
    chipset: WS2812
    rgb_order: GRB
    gamma_correct: 1.0      # la curva de brillo la aplica popstatus_fx.h (con tramado)
    default_transition_length: 300ms
    restore_mode: ALWAYS_OFF
    effects:
      - addressable_lambda:
          name: "Estado"
          update_interval: 33ms     # 30 imagenes/s: suave, poco trabajo y menos envios a los LEDs
          lambda: |-
            using popstatus::Ajuste;
            static const Ajuste ajustes[] = {
              {id(sin_efecto), id(sin_color), id(sin_brillo), id(sin_vel)},
              {id(reposo_efecto), id(reposo_color), id(reposo_brillo), id(reposo_vel)},
              {id(calentando_efecto), id(calentando_color), id(calentando_brillo), id(calentando_vel)},
              {id(imprimiendo_efecto), id(imprimiendo_color), id(imprimiendo_brillo), id(imprimiendo_vel)},
              {id(pausa_efecto), id(pausa_color), id(pausa_brillo), id(pausa_vel)},
              {id(terminado_efecto), id(terminado_color), id(terminado_brillo), id(terminado_vel)},
              {id(error_efecto), id(error_color), id(error_brillo), id(error_vel)},
              {id(caliente_efecto), id(caliente_color), id(caliente_brillo), id(caliente_vel)},
              {id(preparando_efecto), id(preparando_color), id(preparando_brillo), id(preparando_vel)},
              {id(despegar_efecto), id(despegar_color), id(despegar_brillo), id(despegar_vel)},
              {id(enfriando_efecto), id(enfriando_color), id(enfriando_brillo), id(enfriando_vel)},
            };
            bool probando = id(prueba) >= 0;
            int e = probando ? id(prueba) : id(estado);
            if (e < 0 || e > 10) e = 0;
            // brillo final: general x (noche)
            float k = id(brillo_general).state / 100.0f;
            auto ahora = id(hora).now();
            if (id(noche).state && ahora.is_valid()) {
              int h = ahora.hour, a = (int) id(noche_desde).state, b = (int) id(noche_hasta).state;
              bool es_noche = (a <= b) ? (h >= a && h < b) : (h >= a || h < b);
              if (es_noche) k *= id(noche_brillo).state / 100.0f;
            }
            float prog = (e == 2) ? id(calor) : (e == 10 ? id(enfr_prog) : id(progreso));
            if (probando) {   // demo: se llena sola (enfriando: se vacia)
              prog = std::min(1.0f, (millis() - id(prueba_desde)) / 12000.0f);
              if (e == 10) prog = 1.0f - prog;
            }
            // imprimiendo: color del filamento que se esta usando (si no es casi negro)
            Color fil((id(color_fil) >> 16) & 0xFF, (id(color_fil) >> 8) & 0xFF, id(color_fil) & 0xFF);
            bool usa_fil = e == 3 && id(usar_filamento).state && id(hay_color_fil) && std::max(fil.r, std::max(fil.g, fil.b)) > 40;
            popstatus::pintar(it, ajustes[e], prog, id(invertir).state, k, usa_fil ? &fil : nullptr);

interval:
  # Pregunta a la impresora (Moonraker)
  - interval: 3s
    then:
      - http_request.get:
          url: !lambda |-
            return "http://" + id(ip_impresora).state + ":7125/printer/objects/query?print_stats=state,print_duration,info&toolhead=extruder&print_task_config=filament_color_rgba&display_status=progress&virtual_sdcard=progress&webhooks=state"
                   "&heater_bed=temperature,target&extruder=temperature,target&extruder1=temperature,target"
                   "&extruder2=temperature,target&extruder3=temperature,target";
          capture_response: true
          max_response_buffer_size: 6144
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) return;
                  json::parse_json(body, [](JsonObject root) -> bool {
                    JsonObject st = root["result"]["status"];
                    std::string wh = st["webhooks"]["state"] | "";
                    std::string ps = st["print_stats"]["state"] | "";
                    float pr = st["display_status"]["progress"] | 0.0f;
                    float dur = st["print_stats"]["print_duration"] | 0.0f;
                    if (pr <= 0.0f && dur > 0.0f) pr = st["virtual_sdcard"]["progress"] | 0.0f;  // la U1 no siempre manda M73
                    float bed = st["heater_bed"]["temperature"] | 0.0f;
                    float bed_obj = st["heater_bed"]["target"] | 0.0f;
                    if (bed_obj > 0) {
                      int pl = bed_obj <= id(cryogrip_max).state ? 2 : 1;
                      if (pl != id(placa)) id(placa) = pl;
                    }
                    // calentando: el calentador que va mas atrasado respecto a su objetivo
                    float peor = 1.0f; bool calentando = false;
                    const char *heaters[] = {"heater_bed", "extruder", "extruder1", "extruder2", "extruder3"};
                    for (auto *hn : heaters) {
                      JsonObject h = st[hn];
                      if (h.isNull()) continue;
                      float tt = h["target"] | 0.0f, tc = h["temperature"] | 0.0f;
                      float minimo = strcmp(hn, "heater_bed") == 0 ? 25.0f : 40.0f;
                      if (tt > minimo && tc < tt - 3) { calentando = true; peor = std::min(peor, tc / tt); }
                    }
                    int capa = st["print_stats"]["info"]["current_layer"] | -1;
                    id(capa_act) = capa;
                    id(capa_tot) = st["print_stats"]["info"]["total_layer"] | 0;
                    id(duracion) = dur;
                    // filamento activo: toolhead.extruder = "extruder", "extruder1"... -> indice 0..3
                    std::string ex = st["toolhead"]["extruder"] | "";
                    int idx = ex == "extruder" ? 0 : (ex.rfind("extruder", 0) == 0 ? atoi(ex.c_str() + 8) : -1);
                    if (idx >= 0) id(boquilla) = st[ex.c_str()]["temperature"] | 0.0f;
                    JsonArray cols = st["print_task_config"]["filament_color_rgba"];
                    if (idx >= 0 && !cols.isNull() && idx < (int) cols.size()) {
                      std::string hx = cols[idx] | "";
                      if (hx.size() >= 6) { id(color_fil) = strtoul(hx.substr(0, 6).c_str(), nullptr, 16); id(hay_color_fil) = true; }
                    }
                    int e = 1;
                    if (wh == "shutdown" || wh == "error" || ps == "error") e = 6;
                    else if (ps == "printing") e = calentando && capa <= 0 ? 2 : (capa == 0 ? 8 : 3);
                    else if (ps == "paused") e = 4;
                    else if (ps == "complete") e = id(placa) != 2 ? 5 : (bed <= id(despegar_temp).state ? 9 : 10);  // CryoGrip: enfriando -> listo
                    else if (calentando) e = 2;
                    if (e != id(estado_bruto)) {
                      id(estado_bruto) = e; id(estado_desde) = millis();
                      if (e == 10) id(enfr_ini) = bed;
                    }
                    if (e == 10) {   // la barra se vacia segun baja la temperatura
                      float lim = id(despegar_temp).state, ini = std::max(id(enfr_ini), lim + 1.0f);
                      id(enfr_prog) = std::min(1.0f, std::max(0.0f, (bed - lim) / (ini - lim)));
                    }
                    uint32_t min_en = (millis() - id(estado_desde)) / 60000UL;
                    // fin del aviso (con la CryoGrip, «Terminado» dura hasta que enfria y el aviso cuenta desde «Listo para despegar»)
                    if (e == 5 && min_en >= (uint32_t) id(terminado_min).state) e = 1;
                    if (e == 10 && min_en >= 120) e = 1;                                   // por si nunca llega a enfriar
                    if (e == 9 && min_en >= (uint32_t) id(terminado_min).state) e = 1;
                    if (e == 1 && bed > 50) e = 7;                                         // cama caliente
                    if (e == 1 && id(reposo_apagar).state > 0 && min_en >= (uint32_t) id(reposo_apagar).state) e = 0;
                    id(estado) = e;
                    id(progreso) = pr;
                    id(calor) = peor;
                    id(cama) = bed;
                    id(ultimo_ok) = millis();
                    return true;
                  });
  # Enciende o apaga la barra
  - interval: 1s
    then:
      - lambda: |-
          if (id(ultimo_ok) == 0 || millis() - id(ultimo_ok) > 10000) {   // 10 s sin respuesta
            id(estado) = 0;
            if (id(estado_bruto) != 0) { id(estado_bruto) = 0; id(estado_desde) = millis(); }
          }
          if (id(prueba) >= 0 && millis() - id(prueba_desde) > 15000) {
            id(prueba) = -1;
            id(probar).make_call().set_option("No").perform();
          }
          bool quiero = id(activa).state || id(prueba) >= 0;
          auto *l = id(barra);
          if (quiero && (!l->remote_values.is_on() || l->get_effect_name() != "Estado")) {
            auto c = l->turn_on();
            c.set_effect("Estado");
            c.set_brightness(1.0f);
            c.perform();
          } else if (!quiero && l->remote_values.is_on()) {
            l->turn_off().perform();
          }

text_sensor:
  - platform: template
    name: "Estado"
    icon: mdi:printer-3d
    update_interval: 2s
    lambda: |-
      static const char *const nombres[] = {"Sin impresora", "Reposo", "Calentando", "Imprimiendo", "Pausa", "Terminado", "Error", "Cama caliente", "Preparando", "Listo para despegar", "Enfriando"};
      int e = id(estado);
      return std::string(nombres[(e >= 0 && e <= 10) ? e : 0]);
    web_server: {sorting_group_id: g_info, sorting_weight: 1}
  - platform: template
    name: "Color filamento"
    icon: mdi:palette
    update_interval: 3s
    lambda: |-
      if (!id(hay_color_fil)) return std::string("");
      char b[8]; snprintf(b, sizeof(b), "%06X", (unsigned) id(color_fil)); return std::string(b);
    web_server: {sorting_group_id: g_info, sorting_weight: 4}
  - platform: template
    name: "Placa"
    icon: mdi:layers-outline
    update_interval: 5s
    lambda: |-
      static const char *const p[] = {"", "PEI", "CryoGrip"};
      int x = id(placa);
      return std::string(p[(x >= 0 && x <= 2) ? x : 0]);
    web_server: {sorting_group_id: g_info, sorting_weight: 6}
  - platform: wifi_info
    ssid:
      name: "Red WiFi"
      web_server: {sorting_group_id: g_info, sorting_weight: 22}
    ip_address:
      name: "IP"
      web_server: {sorting_group_id: g_info, sorting_weight: 23}
  - platform: version
    name: "Versión"
    hide_timestamp: true
    web_server: {sorting_group_id: g_info, sorting_weight: 20}

sensor:
  - platform: template
    name: "Progreso"
    icon: mdi:progress-clock
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(progreso) * 100.0f;
    web_server: {sorting_group_id: g_info, sorting_weight: 2}
  - platform: template
    name: "Temperatura cama"
    icon: mdi:thermometer
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return id(cama);
    web_server: {sorting_group_id: g_info, sorting_weight: 3}
  - platform: template
    name: "Temperatura boquilla"
    icon: mdi:printer-3d-nozzle-heat
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(boquilla);
    web_server: {sorting_group_id: g_info, sorting_weight: 5}
  - platform: template
    name: "Calentado"
    icon: mdi:fire
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 3s
    lambda: return id(calor) * 100.0f;
    web_server: {sorting_group_id: g_info, sorting_weight: 6}
  - platform: template
    name: "Calor restante"
    icon: mdi:snowflake-melt
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(enfr_prog) * 100.0f;
    web_server: {sorting_group_id: g_info, sorting_weight: 6}
  - platform: template
    name: "Capa"
    icon: mdi:layers
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(capa_act);
    web_server: {sorting_group_id: g_info, sorting_weight: 7}
  - platform: template
    name: "Capas totales"
    icon: mdi:layers-triple
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return id(capa_tot);
    web_server: {sorting_group_id: g_info, sorting_weight: 8}
  - platform: template
    name: "Tiempo imprimiendo"
    icon: mdi:timer-outline
    unit_of_measurement: "min"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return id(duracion) / 60.0f;
    web_server: {sorting_group_id: g_info, sorting_weight: 9}
  - platform: template
    name: "Tiempo restante"
    icon: mdi:timer-sand
    unit_of_measurement: "min"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      float p = id(progreso), d = id(duracion);
      if (id(estado) != 3 || p < 0.02f || d < 60) return NAN;   // aun sin datos para calcularlo
      return d * (1.0f - p) / p / 60.0f;
    web_server: {sorting_group_id: g_info, sorting_weight: 10}
  - platform: internal_temperature
    name: "Temperatura chip"
    icon: mdi:chip
    update_interval: 30s
    web_server: {sorting_group_id: g_info, sorting_weight: 24}
  - platform: wifi_signal
    name: "WiFi"
    update_interval: 60s
    web_server: {sorting_group_id: g_info, sorting_weight: 21}
